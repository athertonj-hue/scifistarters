<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciFiStarters.org | Research-Backed Movie Starters for Science Teachers</title>
<style>
:root { --primary:#0f172a; --accent:#2563eb; --accent-light:#eff6ff; --warn-bg:#fef3c7; --warn-border:#f59e0b; --warn-text:#92400e; --bg:#f8fafc; --card:#ffffff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; }
header { background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%); color:#fff; padding:2.5rem 1.25rem; text-align:center; }
.badge { display:inline-block; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); padding:0.3rem 0.85rem; border-radius:999px; font-size:0.8rem; font-weight:600; margin-bottom:0.9rem; }
header h1 { font-size:clamp(1.9rem,4vw,2.8rem); font-weight:800; margin-bottom:0.6rem; }
header p.subtitle { max-width:720px; margin:0 auto 1.25rem; font-size:1.05rem; color:#dbeafe; }
.credits-pill { display:inline-block; background:rgba(15,23,42,0.55); padding:0.5rem 1rem; border-radius:8px; font-size:0.85rem; color:#e2e8f0; }
.credits-pill strong { color:#fff; }
.credits-pill a { color:#93c5fd; text-decoration:underline; }
.container { max-width:1140px; margin:0 auto; padding:1.5rem 1.25rem 3rem; }
.controls { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1.5rem; display:grid; grid-template-columns:1fr; gap:0.85rem; }
@media (min-width:768px) { .controls { grid-template-columns:2fr 1fr 1fr; } }
input, select { width:100%; padding:0.7rem 0.9rem; border:1px solid #cbd5e1; border-radius:8px; font-size:0.95rem; background:#fff; color:var(--text); }
.results-bar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; font-size:0.9rem; color:var(--muted); }
.grid { display:grid; grid-template-columns:1fr; gap:1.25rem; }
@media (min-width:820px) { .grid { grid-template-columns:repeat(2,1fr); } }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.4rem; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 2px 8px rgba(15,23,42,0.04); }
.tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.75rem; }
.tag { font-size:0.75rem; font-weight:700; padding:0.25rem 0.6rem; border-radius:6px; background:var(--accent-light); color:var(--accent); }
.tag.age { background:#f1f5f9; color:#334155; }
.card h2 { font-size:1.25rem; color:var(--primary); margin-bottom:0.2rem; }
.topic-line { font-size:0.9rem; font-weight:600; color:var(--accent); margin-bottom:0.9rem; }
.section-block { margin-bottom:0.85rem; font-size:0.93rem; }
.section-label { font-weight:700; font-size:0.78rem; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:0.15rem; }
.misconception-box { background:var(--warn-bg); border-left:4px solid var(--warn-border); padding:0.75rem 0.9rem; border-radius:6px; margin-bottom:0.9rem; font-size:0.9rem; color:#451a03; }
.misconception-box strong { color:var(--warn-text); display:block; font-size:0.78rem; text-transform:uppercase; margin-bottom:0.2rem; }
.question-box { background:#f8fafc; border:1px solid #cbd5e1; padding:0.85rem; border-radius:8px; margin-bottom:1rem; }
.question-box strong { display:block; font-size:0.78rem; text-transform:uppercase; color:var(--primary); margin-bottom:0.25rem; }
.project-btn { width:100%; background:var(--primary); color:#fff; border:none; padding:0.7rem 1rem; border-radius:8px; font-size:0.92rem; font-weight:600; cursor:pointer; }
.project-btn:hover { background:var(--accent); }
.about-section { margin-top:3rem; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; }
.about-section h2 { font-size:1.4rem; color:var(--primary); margin-bottom:0.75rem; }
.about-section p { margin-bottom:0.9rem; color:#334155; font-size:0.97rem; }
.wipro-callout { background:var(--accent-light); border-left:4px solid var(--accent); padding:1rem 1.2rem; border-radius:6px; margin-top:1rem; }
.modal { display:none; position:fixed; inset:0; background:#0f172a; color:#fff; z-index:1000; padding:2rem; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
.modal.open { display:flex; }
.modal-meta { color:#93c5fd; font-size:1.1rem; font-weight:600; margin-bottom:1.25rem; text-transform:uppercase; }
.modal-question { font-size:clamp(1.6rem,4vw,3.1rem); font-weight:700; max-width:960px; line-height:1.3; margin-bottom:2.5rem; }
.close-btn { background:#fff; color:#0f172a; border:none; padding:0.8rem 1.6rem; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
</style>
</head>

<script>

<script>
// The full HTML structure for SciFiStarters.org header, search controls, cards grid, about section, and whiteboard modal
const p = document.createElement('div');
p.innerHTML = [
  // Header and credits information
  '<header>...', '</header>',
  // Main container with search inputs, age/subject filters, results bar, cards grid, and research/Wipro about section
  '<main class="container">...</main>',
  // Whiteboard modal overlay
  '<div class="modal" id="whiteboardModal">...</div>'
].join('');
document.body.appendChild(p);
</script>

<script>
const STARTER_CLIPS = [
  { film:"WALL-E (2008)", age:"Primary", ageLabel:"Primary (Ages 5–11 / KS1–KS2)", subject:"Biology", topic:"Plants, Habitats & Human Impact", whichBit:"Opening 15 minutes (~00:02:00 – 00:16:00): WALL-E compacts towers of rubbish on a barren Earth before discovering a single green seedling growing inside an old boot.", howItLinks:"Introduces what plants need to survive (water, light, soil/nutrients) and sparks discussion on recycling, waste, and caring for habitats.", misconception:"In the film, Earth has zero plants left yet still has breathable air and dust storms. In real life, plants and algae produce the oxygen animals need to breathe.", question:"What did that tiny plant inside the boot need in order to grow, and why couldn't humans stay on Earth without plants?" },
  { film:"Big Hero 6 (2014)", age:"Primary", ageLabel:"Primary (Ages 5–11 / KS2)", subject:"Physics", topic:"Forces, Materials & Robotics", whichBit:"Hiro's microbots demonstration (~00:18:30 – 00:21:00): Thousands of tiny magnetic robots link together using a neural transmitter to build structures and carry heavy objects.", howItLinks:"Demonstrates how simple building blocks can join into strong structures and introduces magnetic attraction and engineering design.", misconception:"Tiny coin-sized batteries could not power thousands of microbots to lift heavy vehicles against gravity for long periods.", question:"How do the microbots stick together to form bridges and towers, and what everyday materials behave like solids or liquids depending on how they are packed?" },
  { film:"The Iron Giant (1999)", age:"Primary", ageLabel:"Primary (Ages 5–11 / KS1–KS2)", subject:"Chemistry", topic:"Properties of Materials & Metals", whichBit:"Scrapyard meal scene (~00:34:00 – 00:37:30): Hogarth feeds the Giant scrap metal cars and girders while avoiding non-metal objects.", howItLinks:"Helps younger learners classify materials (metals vs. plastics, rubber, and glass) and discuss properties such as strength, hardness, and magnetism.", misconception:"Eating metal wouldn't fuel a robot—machines need electrical or chemical energy sources rather than digesting solid steel.", question:"Which parts of the scrapyard cars are made of metal, and how could we test which pieces are magnetic?" },
  { film:"You Only Live Twice (1967)", age:"Lower Secondary", ageLabel:"Lower Secondary (Ages 11–14 / KS3)", subject:"Physics", topic:"Electromagnets & Magnetic Materials", whichBit:"Tokyo car chase (~01:14:20 – 01:16:05): A helicopter lowers a giant electromagnet onto a getaway car, lifts it into the air, and drops it into Tokyo Bay.", howItLinks:"Illustrates how switching an electric current on turns a coil and core into a temporary magnet that attracts steel—and releases it when switched off.", misconception:"A helicopter-portable electromagnet of that size couldn't generate a field strong enough to lift a 1.5-tonne car, and the extra weight would crash the helicopter.", question:"Why does the magnet only pick up the car when the pilot flips the switch—and why wouldn't this trick work on a modern aluminium-bodied car?" },
  { film:"Jurassic Park (1993)", age:"Lower Secondary", ageLabel:"Lower Secondary (Ages 11–14 / KS3)", subject:"Biology", topic:"DNA, Extinction & Fossils", whichBit:"Mr DNA animation tour (~00:19:30 – 00:23:00): Scientists explain extracting dinosaur blood from mosquitoes trapped in amber and filling DNA gaps with frog DNA.", howItLinks:"Introduces DNA as the genetic code stored inside cells and explains how amber preserves ancient organisms as fossils.", misconception:"DNA breaks down over tens of thousands of years—intact dinosaur DNA cannot survive 65 million years in amber, nor can frog DNA simply patch missing sequences.", question:"Where inside a cell is DNA found, and why can't scientists actually bring back dinosaurs from mosquitoes trapped in amber?" },
  { film:"Star Wars: Episode IV – A New Hope (1977)", age:"Lower Secondary", ageLabel:"Lower Secondary (Ages 11–14 / KS3)", subject:"Physics", topic:"Sound Waves & Vacuum of Space", whichBit:"Trench Run battle (~01:45:00 – 01:52:00): X-Wing and TIE fighters roar past the camera with loud engine screeches and laser blasts in deep space.", howItLinks:"Contrasts light waves (which travel through a vacuum) with sound waves (which require particles in a medium to vibrate).", misconception:"Students frequently assume loud explosions can be heard in space because nearly every sci-fi film adds dramatic sound effects.", question:"We can clearly see the laser flashes in deep space—so why wouldn't an astronaut actually hear the TIE fighters screaming past?" },
  { film:"The Core (2003)", age:"Upper Secondary", ageLabel:"Upper Secondary (Ages 14–18 / GCSE–A-Level)", subject:"Earth & Space", topic:"Structure of the Earth & Magnetic Field", whichBit:"Peach demonstration briefing (~00:22:00 – 00:26:30): Dr Keyes uses a peach and a blowtorch to explain Earth's crust, mantle, molten outer core, and magnetic field.", howItLinks:"Visualises Earth's internal layers and how convection currents in the liquid iron outer core generate Earth's protective magnetosphere.", misconception:"Earth's outer core could not suddenly stop spinning, nor could a vessel survive the extreme pressures (over 3 million atmospheres) and temperatures inside the mantle.", question:"How does Earth's liquid outer core protect life on the surface from solar radiation, and how do scientists know what is inside the Earth without drilling there?" },
  { film:"Gattaca (1997)", age:"Upper Secondary", ageLabel:"Upper Secondary (Ages 14–18 / GCSE–A-Level)", subject:"Biology", topic:"Genetic Screening, Inheritance & Bioethics", whichBit:"Geneticist consultation (~00:11:30 – 00:14:30): Parents select an embryo screened to eliminate predispositions to heart disease, myopia, and genetic disorders.", howItLinks:"Connects directly to pre-implantation genetic diagnosis (PGD), polygenic vs. single-gene traits, and ethical debates around genetic determinism.", misconception:"Complex human traits like intelligence, musicality, and lifespan are heavily shaped by environment and hundreds of interacting genes—not guaranteed by a single embryo screen.", question:"Which conditions can genuinely be screened for using single-gene testing today, and why doesn't DNA alone determine a person's future health or ability?" },
  { film:"The Martian (2015)", age:"Upper Secondary", ageLabel:"Upper Secondary (Ages 14–18 / GCSE–A-Level)", subject:"Chemistry", topic:"Stoichiometry, Hydrazine & Combustion", whichBit:"Making water in the Hab (~00:34:00 – 00:38:30): Mark Watney decomposes hydrazine rocket fuel over an iridium catalyst to produce hydrogen and burns it with oxygen to make water.", howItLinks:"Demonstrates conservation of mass, catalytic decomposition, exothermic combustion reactions, and limiting reactants in a real-world problem-solving context.", misconception:"Burning pure hydrogen inside a sealed habitat carries a severe explosion risk—in the film, Watney forgets to account for the hydrogen he exhales before adjusting his calculation.", question:"Write the balanced symbol equation for hydrogen reacting with oxygen to form water—and explain why Watney's calculation nearly blew up the habitat." }
];

const grid = document.getElementById("cardsGrid"), searchInput = document.getElementById("searchInput"), ageFilter = document.getElementById("ageFilter"), subjectFilter = document.getElementById("subjectFilter"), resultsCount = document.getElementById("resultsCount");

function renderCards() {
  const q = searchInput.value.toLowerCase().trim(), a = ageFilter.value, s = subjectFilter.value;
  const f = STARTER_CLIPS.filter(i => (a === "All" || i.age === a) && (s === "All" || i.subject === s) && (!q || (i.film + " " + i.topic + " " + i.whichBit + " " + i.howItLinks + " " + i.misconception + " " + i.question).toLowerCase().indexOf(q) !== -1));
  resultsCount.textContent = "Showing " + f.length + " starter " + (f.length === 1 ? "clip" : "clips");
  if (!f.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:#64748b;">No starter clips match that filter yet.</p>'; return; }
  grid.innerHTML = f.map(i => '<article class="card"><div><div class="tags"><span class="tag">' + i.subject + '</span><span class="tag age">' + i.ageLabel + '</span></div><h2>' + i.film + '</h2><div class="topic-line">' + i.topic + '</div><div class="section-block"><span class="section-label">Which Bit (Scene &amp; Timestamp)</span>' + i.whichBit + '</div><div class="section-block"><span class="section-label">How It Links to the Science</span>' + i.howItLinks + '</div><div class="misconception-box"><strong>Plausible Misconception Alert (SSR Framework)</strong>' + i.misconception + '</div></div><div><div class="question-box"><strong>Framing Question (Classroom Starter)</strong>"' + i.question + '"</div><button class="project-btn" onclick="openModal(\'' + i.film.replace(/'/g, "\\'") + '\',\'' + i.topic.replace(/'/g, "\\'") + '\',\'' + i.question.replace(/'/g, "\\'") + '\')">Project Question Full-Screen</button></div></article>').join("");
}

function openModal(f, t, q) { document.getElementById("modalMeta").textContent = f + " • " + t; document.getElementById("modalQuestion").textContent = '"' + q + '"'; document.getElementById("whiteboardModal").classList.add("open"); }
function closeModal() { document.getElementById("whiteboardModal").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
searchInput.addEventListener("input", renderCards); ageFilter.addEventListener("change", renderCards); subjectFilter.addEventListener("change", renderCards);
renderCards();
</script>
</body>
</html>
